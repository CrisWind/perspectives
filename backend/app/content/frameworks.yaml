# 思维框架。由产品同学维护：改这里不用改代码。
# method 会写进角色的提示词；moves 是这个框架常用的追问方式。
- id: premortem
  name: 事前验尸
  method: 假设一年后这个决定已经失败了，倒推最可能的失败原因，再看用户的理由有没有防住这些原因。
  moves:
    - 如果一年后证明选错了，最可能是因为什么？
    - 这条理由成立需要哪些前提？哪个前提最脆弱？
- id: inversion
  name: 逆向思考
  method: 不问怎么做成，而问怎样一定会搞砸；把用户的理由反过来说一遍，看反面是否同样说得通。
  moves:
    - 把这条理由反过来说，是不是同样成立？
    - 要想让这件事一定失败，应该怎么做？你现在有没有在这么做？
- id: opportunity_cost
  name: 机会成本
  method: 每个选择的真实代价是被放弃的那个最好的替代选项；把时间、金钱、可选项都算进账里，用数字和事实说话。
  moves:
    - 选了这个，你放弃的是什么？它值多少？
    - 这条理由里的数字或事实，有依据吗？
- id: values
  name: 价值澄清
  method: 区分"我想要"和"别人觉得我应该要"；追问每条理由背后真正在乎的东西，看理由之间有没有互相打架。
  moves:
    - 这条理由是你自己的，还是别人期待你有的？
    - 如果没有人知道你的选择，你还会这样选吗？
- id: small_bets
  name: 最小试错
  method: 先看决定可不可逆；可逆的就用最便宜、最快的办法先试一下，不可逆的才值得慢慢想。
  moves:
    - 这个决定能反悔吗？反悔的代价多大？
    - 有没有办法花两周、很少的钱先验证这条理由？
- id: fear_setting
  name: 最坏情况推演
  method: 把最坏的情况具体写出来：有多坏、多大可能、能不能补救、补救要多久；模糊的恐惧和模糊的乐观都要落到具体。
  moves:
    - 最坏会怎样？到那一步你有什么退路？
    - 你的安全垫（存款、技能、人脉）能撑多久？
- id: third_option
  name: 第三选项
  method: 质疑"二选一"本身；寻找能同时保住两边核心好处的做法，或者换一个问题来问。
  moves:
    - 真的只有这两个选项吗？
    - 两边你最想保住的各是什么？有没有同时保住的办法？
- id: first_principles
  name: 第一性原理
  method: 把理由拆到不能再拆的事实和假设，分清哪些是事实、哪些是类比和"大家都这么说"。
  moves:
    - 这是事实，还是你听来的说法？
    - 去掉"别人都这样"，这条理由还剩下什么？
- id: ten_ten_ten
  name: 10-10-10 法则
  method: 分别站在 10 分钟后、10 个月后、10 年后回看这个决定，看每条理由在哪个时间尺度上还重要。
  moves:
    - 10 年后回头看，这条理由还重要吗？
    - 哪种选择让你 10 年后更可能后悔？
