# 思维框架。由产品同学维护：改这里不用改代码。
# method 会写进角色的提示词；moves 是这个框架常用的追问方式。
- id: premortem
  name: 事前验尸
  method: 假设一年后这个决定已经失败了，倒推最可能的失败原因，再看用户的理由有没有防住这些原因。
  moves:
    - 如果一年后证明选错了，最可能是因为什么？
    - 这条理由成立需要哪些前提？哪个前提最脆弱？
- id: inversion
  name: 逆向思考
  method: 不问怎么做成，而问怎样一定会搞砸；把用户的理由反过来说一遍，看反面是否同样说得通。
  moves:
    - 把这条理由反过来说，是不是同样成立？
    - 要想让这件事一定失败，应该怎么做？你现在有没有在这么做？
- id: opportunity_cost
  name: 机会成本
  method: 每个选择的真实代价是被放弃的那个最好的替代选项；把时间、金钱、可选项都算进账里，用数字和事实说话。
  moves:
    - 选了这个，你放弃的是什么？它值多少？
    - 这条理由里的数字或事实，有依据吗？
- id: values
  name: 价值澄清
  method: 区分"我想要"和"别人觉得我应该要"；追问每条理由背后真正在乎的东西，看理由之间有没有互相打架。
  moves:
    - 这条理由是你自己的，还是别人期待你有的？
    - 如果没有人知道你的选择，你还会这样选吗？
- id: small_bets
  name: 最小试错
  method: 先看决定可不可逆；可逆的就用最便宜、最快的办法先试一下，不可逆的才值得慢慢想。
  moves:
    - 这个决定能反悔吗？反悔的代价多大？
    - 有没有办法花两周、很少的钱先验证这条理由？
- id: fear_setting
  name: 最坏情况推演
  method: 把最坏的情况具体写出来：有多坏、多大可能、能不能补救、补救要多久；模糊的恐惧和模糊的乐观都要落到具体。
  moves:
    - 最坏会怎样？到那一步你有什么退路？
    - 你的安全垫（存款、技能、人脉）能撑多久？
- id: third_option
  name: 第三选项
  method: 质疑"二选一"本身；寻找能同时保住两边核心好处的做法，或者换一个问题来问。
  moves:
    - 真的只有这两个选项吗？
    - 两边你最想保住的各是什么？有没有同时保住的办法？
- id: first_principles
  name: 第一性原理
  method: 把理由拆到不能再拆的事实和假设，分清哪些是事实、哪些是类比和"大家都这么说"。
  moves:
    - 这是事实，还是你听来的说法？
    - 去掉"别人都这样"，这条理由还剩下什么？
- id: backcasting
  name: 以终为始
  method: 先把三年后想要的状态说具体，再倒推现在这一步是不是在通往那里的路上；分清目标和手段，别把手段当成了目标。
  moves:
    - 三年后你想过什么样的日子？这个选择是通往那里的必经之路吗？
    - 你要的是这个选择本身，还是它能带来的东西？后者有没有更直接的拿法？
- id: stakeholders
  name: 关系人视角
  method: 把受这个决定影响的人逐个列出来，分清他们亲口说过的话和你替他们想象的话；看理由里哪些是你自己的，哪些是在替别人做决定。
  moves:
    - 这个决定会影响到谁？他们的想法你问过本人吗，还是在猜？
    - 如果只考虑你自己，结论会变吗？
- id: second_order
  name: 二阶效应
  method: 不停在决定的直接结果上，连续追问"然后呢"，看第二步、第三步会发生什么；很多理由在第一步成立，到第二步就反过来了。
  moves:
    - 做了这个选择，然后呢？再然后呢？
    - 这条理由带来的好处，会不会引出一个更麻烦的新问题？
- id: criteria
  name: 标准先行
  method: 先把"好选择"的标准和轻重定下来，再让各个选项逐项对照；警惕先有了答案再回头找标准。
  moves:
    - 你判断好坏的标准是哪几条？哪一条最重要？
    - 这些标准是做决定之前就有的，还是为了支持现在的倾向才想出来的？
- id: friend_test
  name: 朋友测试
  method: 换个位置看：如果是你最好的朋友带着同样的处境和理由来问你，你会怎么劝。人劝别人时比劝自己清醒，对自己格外宽容的地方往往就是理由的软肋。
  moves:
    - 如果是你最好的朋友这么想，你会怎么劝？
    - 你劝朋友的那些话，为什么放在自己身上就不算数了？
- id: base_rate
  name: 基准率
  method: 先不看自己的特殊情况，先看和你处境相似的人通常是什么结果；再问凭什么你比他们更可能成，依据必须是已经发生的事实，不能是决心。手头没有可靠数据时不要自己估一个比例或说"大多数人"，而是指出该去查哪一类人的结果、去哪里查。
  moves:
    - 和你情况差不多的人这么选了之后，大多数怎么样了？
    - 你觉得自己会是例外，依据是哪件已经发生的事？
- id: gut_check
  name: 直觉校验
  method: 假设决定已经做完、不能更改，分别体会两种结局下的第一反应；把"害怕"和"不想要"分开，把"一时兴奋"和"真的想要"分开。直觉是有用的信号，但要读对。
  moves:
    - 假设明早醒来这件事已经定了，你的第一反应是松一口气，还是心里一沉？
    - 你抗拒另一个选项，是因为害怕它，还是因为真的不想要它？
- id: day_in_life
  name: 日常推演
  method: 把每个选择落到具体的一天：几点起、在哪里、和谁在一起、手上在做什么、晚上是什么心情。人容易爱上一个选择的名头，却要每天过它的日常。
  moves:
    - 选了它之后，一个普通的周二你是怎么过的？
    - 你喜欢的是这个选择听起来的样子，还是每天真正要做的那些事？
