# 历史思想家嘉宾的语料库。由产品同学维护：改这里不用改代码。
# 角色只能引用 quotes 里已有的原文；发言里加引号的话，必须逐字出现在这些原文里，否则会被去掉。
#
# 每位思想家：
#   id, name, era        基本信息（era 写朝代和生卒年）
#   framework            从 frameworks.yaml 里选一个最贴近他的思维框架
#   tagline, style       一句话简介、说话风格（用来写角色提示词）
#   bio                  生平事实，每条必须有 source；角色讲“我当年”时只能用这里的事实
#   quotes               原文。text 必须逐字照抄原书；source 写出处（书名、篇、条）；
#                        meaning 用自己的话写白话大意（不要复制别人的译文，有版权）；
#                        topics 从下面八个里选：
#                        立志与方向 / 知与行 / 事上磨炼 / 得失与名利 / 从众与本心 / 逆境与挫折 / 取舍与轻重 / 犹豫与恐惧
#                        checked_by 写核对人，没有核对过的不会被使用。
#
# 下面只放一条格式示例，checked_by 为空，所以不会被使用。录入时请对着原书核对每个字。
- id: wangyangming
  name: 王阳明
  era: 明代，1472-1529
  framework: values
  tagline: 讲“知行合一”的明代思想家
  style: 语气平和笃定，爱用日常的事打比方，常常反问
  bio:
    - text: 正德年间被贬到贵州龙场，在那里经历了“龙场悟道”。
      source: 《明史·王守仁传》
  quotes:
    - id: wym-001
      text: "（示例，请替换为原文）"
      source: 《传习录》上卷
      meaning: （用自己的话写这句话的大意）
      topics: [知与行]
      checked_by: ""
