<!doctype html>
<html lang="zh-CN"><head><base href="/ui/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perspectives · 组建我的圆桌</title><link rel="stylesheet" href="styles.css?revision=6"><link rel="stylesheet" href="pastel.css?revision=7"><link rel="stylesheet" href="app.css"></head><body><div class="shell">
<header class="nav"><a class="brand" href="/"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="12" cy="16" r="9" stroke="#d4dfb2"/><circle cx="20" cy="16" r="9" stroke="#d4dfb2"/></svg>Perspectives</a><a href="/" class="quiet">← 返回首页</a></header>
<main><section class="choose-intro"><div><div class="eyebrow">Meet your council</div><h1>这一次，想和谁聊聊？</h1></div><div class="journey"><span>01 说出问题</span><span>—</span><span>02 邀请嘉宾</span><span>—</span><span>03 开始圆桌</span></div></section>
<div class="choose-grid"><section class="form-panel"><div class="panel-heading"><span class="number">01</span><h2>你在纠结什么？</h2></div><div class="field"><label for="question">你的问题 <small>必填</small></label><textarea id="question" required minlength="4" maxlength="1000" placeholder="比如：要不要离开稳定的工作，去做自己真正喜欢的事？"></textarea><div class="help">把选择和处境写具体一点，更容易展开讨论。</div></div><div class="field"><label for="leaning">目前的观点倾向 <small>可选</small></label><input id="leaning" maxlength="200" placeholder="我现在更倾向于……"><div class="options" id="leanings"><button class="chip">倾向改变</button><button class="chip">倾向维持现状</button><button class="chip">还没想好</button></div></div><div class="field"><label for="reasons">你最在意的事 <small>可选</small></label><textarea id="reasons" maxlength="1205" placeholder="每行一条，最多 6 条、每条 200 字。"></textarea></div><p class="mini-note">不必先想好答案。<br>把支持和反对的理由，一起带到桌上。</p></section>
<section><div class="selection-top"><div class="panel-heading"><span class="number">02</span><h2>邀请不同的视角</h2></div><span class="quiet">16 位嘉宾 · 选 2–4 位</span></div><div class="choose-role-summary"><div class="role-identity"><strong id="role-mbti">INTJ</strong><span id="role-name">弈</span></div></div><div class="stack" tabindex="0" role="region" aria-label="嘉宾卡片，左右方向键切换"><article id="prev-card" class="stack-card personality-sheet left" aria-hidden="true"></article><article id="next-card" class="stack-card personality-sheet right" aria-hidden="true"></article><button type="button" aria-label="放大当前性格卡" id="main-card" class="stack-card personality-sheet main" aria-live="polite"></button><div class="stack-nav"><button class="round" id="previous" aria-label="上一位嘉宾">←</button><span id="counter">01 / 16</span><button class="round" id="next" aria-label="下一位嘉宾">→</button></div></div><div class="card-detail"><button class="button" id="select-role">✓ 已加入 · 点击移出</button><div class="help" id="selection-hint" aria-live="polite">浏览卡片不会改变已选阵容</div></div><section class="roster"><div class="roster-title"><span id="roster-count">你的阵容 · 4 / 4</span><small id="roster-label">默认推荐，可自由替换</small></div><div class="seats" id="seats"></div></section><label class="sage-option" aria-describedby="sage-status"><span class="sage-glyph" aria-hidden="true">知</span><span class="sage-copy"><strong>再邀请一位思想家</strong><p>王阳明 ·《传习录》<br><span id="sage-status">正在确认可用状态…</span></p></span><input id="thinker" disabled class="switch" type="checkbox" aria-label="邀请王阳明"></label></section></div>
<div class="start-bar"><div><strong id="summary">等待填写问题 · 4 位嘉宾</strong><p id="status">阵容已就绪，带着你的问题入座。</p></div><button id="enter" class="button primary">进入圆桌会议 <span>↗</span></button></div><p class="design-notice" id="service-status" role="status">正在连接辩论服务…</p><p id="submit-error" role="alert" tabindex="-1"></p>
</main></div><dialog id="personality-dialog" aria-labelledby="personality-title"><div class="personality-dialog-head"><h3 id="personality-title"></h3><button class="round" id="close-personality" aria-label="关闭性格卡" autofocus>×</button></div><img id="personality-image" alt=""></dialog><script src="roles.js?revision=6"></script><script src="state.js"></script><script src="choose.js"></script></body></html>
