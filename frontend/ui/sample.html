<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perspectives · 样例辩论</title><link rel="stylesheet" href="styles.css?revision=5"><link rel="stylesheet" href="pastel.css?revision=5"></head><body class="sample-subpage"><main aria-labelledby="sample-heading"><section id="sample-content" class="sample"><div class="sample-copy"><div class="eyebrow">A seat at the table</div><h2 id="sample-heading">先听听，<br>一场纠结怎样被展开。</h2><p>“要不要离开稳定的工作，去做喜欢的事？”<br>同一道问题，听见不同的出发点。</p><span class="badge">样例辩论 · 发言回放</span></div><div class="player"><div class="player-title"><span>稳定，还是热爱？</span><span class="badge">第一轮 / 观点陈述</span></div><div class="speaker"><img id="speaker-image" src="assets/laomou.webp" alt="弈"><div><b id="speaker-name">弈 · INTJ</b><small id="speaker-method">从失败的可能性开始</small></div></div><blockquote id="sample-quote">“先别急着问值不值得。如果一年后这次转行失败了，最可能是什么原因？”</blockquote><div class="player-controls"><button class="round" id="sample-play" aria-label="播放样例">▷</button><input style="flex:1;min-width:0;accent-color:var(--accent)" aria-label="样例进度" id="sample-position" type="range" min="0" max="2" value="0"><span class="quiet" id="sample-time">01 / 03</span><button class="round" id="sample-reset" aria-label="重新播放">↺</button></div></div></section></main><script>const samples=[['laomou','弈 · INTJ','从失败的可能性开始','“先别急着问值不值得。如果一年后这次转行失败了，最可能是什么原因？”'],['zhangfang','溯 · ISTJ','把代价放到桌面上','“先算清楚：你的存款，能支持多长时间的探索？这会改变选择的边界。”'],['nuannuan','晴 · INFP','找到真正重视的东西','“你想离开的，是这份工作，还是现在的生活方式？这两件事值得分开想。”']];let pos=0,timer=null;const play=document.getElementById('sample-play'),range=document.getElementById('sample-position');function renderSample(){const s=samples[pos];document.getElementById('speaker-image').src='assets/'+s[0]+'.webp';document.getElementById('speaker-image').alt=s[1];document.getElementById('speaker-name').textContent=s[1];document.getElementById('speaker-method').textContent=s[2];document.getElementById('sample-quote').textContent=s[3];range.value=pos;document.getElementById('sample-time').textContent='0'+(pos+1)+' / 03'}function stop(){clearInterval(timer);timer=null;play.textContent='▷';play.setAttribute('aria-label','播放样例')}play.onclick=()=>{if(timer){stop();return}play.textContent='Ⅱ';play.setAttribute('aria-label','暂停样例');timer=setInterval(()=>{if(pos===2){stop();return}pos++;renderSample()},3500)};range.oninput=()=>{pos=+range.value;renderSample()};document.getElementById('sample-reset').onclick=()=>{stop();pos=0;renderSample()};

window.addEventListener('keydown', e => {if(e.key==='Escape' && parent!==window) parent.postMessage({type:'close-sample'},'*')});
window.addEventListener('pagehide',stop);
</script></body></html>
